    image: internetsystemsconsortium/bind9:9.18
    container_name: root
    command:
    - -g
    - -c
    - /etc/bind/named.conf
    volumes:
    - ./root/named.conf:/etc/bind/named.conf:ro
    - ./root/zones:/var/lib/bind
    networks:
      dnslab:
